# RecBole on its own built-in ml-1m, configured to match recsys_large_scale's protocol
# as closely as RecBole allows. Every setting below that has a counterpart on our side is
# annotated with it, because an unnoticed mismatch here would silently invalidate the
# entire comparison.

dataset: ml-1m
data_path: dataset/

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, rating, timestamp]

# == our configs/data_movielens1m.yaml positive_feedback.min_rating: 3.5
# ML-1M ratings are whole stars, so this keeps exactly the 4- and 5-star rows.
val_interval:
  rating: "[3.5,inf)"
# == our min_user_interactions / min_item_interactions: 5
user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"

eval_args:
  group_by: user                   # == our per-user split
  order: TO                        # == our timestamp ordering
  split: {'LS': 'valid_and_test'}  # == our leave_one_out_split: last -> test, 2nd-last -> val
  mode: full                       # == our full-catalog ranking in harness.evaluate

# Recall/NDCG/MRR/Hit/Precision/MAP line up with our metrics.py; ItemCoverage is our
# coverage; AveragePopularity and ShannonEntropy are RecBole's nearest equivalents to
# our popularity_bias and novelty (related, NOT identical -- see COMPARISON.md).
metrics: ['Recall', 'NDCG', 'MRR', 'Hit', 'Precision', 'MAP', 'ItemCoverage', 'AveragePopularity', 'ShannonEntropy']
topk: [5, 10, 20]
valid_metric: NDCG@10

epochs: 100
train_batch_size: 4096
eval_batch_size: 4096
stopping_step: 10

seed: 42
reproducibility: True
show_progress: False

[project]
name = "recsys-large-scale"
version = "0.1.0"
description = "Advanced recommender systems at scale: multiple modeling approaches, ranking metrics, latency, and personalization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "implicit>=0.7.2",
    "faiss-cpu>=1.9",
    "lightgbm>=4.5",
    "pyarrow>=17.0",
    "polars>=1.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "kaggle>=1.6",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_large_scale"]
